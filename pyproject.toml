[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-detection"
version = "0.1.0"
description = "Real-time bottle defect detection with YOLO + ByteTrack"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "torch>=2.1.0",
    "ultralytics>=8.0.220",
    "pyyaml>=6.0.1",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "pre-commit>=3.8.0"]
export = ["coremltools", "onnx", "onnxruntime"]

[project.scripts]
defect-detect = "defect_detection.cli.detect:main"
defect-db = "defect_detection.cli.db_utils:main"
defect-gui = "defect_detection.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"defect_detection.inference" = ["trackers/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]